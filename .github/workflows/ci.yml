name: pipeline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests
        run: php artisan test

  build:
    name: build immutable image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      release: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: deploy staging
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the built image
        run: |
          docker run -d --name staging -p 8080:8080 \
            -e APP_KEY=${{ secrets.APP_KEY }} \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/db.sqlite \
            -e CACHE_STORE=file \
            -e SESSION_DRIVER=file \
            ${{ env.IMAGE }}:${{ github.sha }}
          docker exec staging touch /tmp/db.sqlite

      - name: Health gate
        run: ./scripts/health-gate.sh http://localhost:8080 ${{ github.sha }} 90

      - name: Container logs on failure
        if: failure()
        run: docker logs staging

  production:
    name: promote to production
    needs: [build, staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Promote the exact SHA that passed staging
        run: |
          echo "Promoting ${{ env.IMAGE }}:${{ github.sha }}"
          echo "No rebuild happens here. The artifact validated in staging is the"
          echo "artifact that reaches production, byte for byte."

      - name: Health gate against production
        run: |
          echo "In a real deployment this runs:"
          echo "  ./scripts/health-gate.sh https://app.example.com ${{ github.sha }} 120"
          echo "and rolls back to the previous SHA if it fails."
